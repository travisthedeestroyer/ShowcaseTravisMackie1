<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a1a"/>
      <stop offset="100%" style="stop-color:#0a0f2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="400" ry="300" fill="#3b82f6" opacity="0.08"/>
  <ellipse cx="900" cy="450" rx="350" ry="250" fill="#8b5cf6" opacity="0.06"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="144" x2="1280" y2="144"/>
    <line x1="0" y1="288" x2="1280" y2="288"/>
    <line x1="0" y1="432" x2="1280" y2="432"/>
    <line x1="0" y1="576" x2="1280" y2="576"/>
    <line x1="256" y1="0" x2="256" y2="720"/>
    <line x1="512" y1="0" x2="512" y2="720"/>
    <line x1="768" y1="0" x2="768" y2="720"/>
    <line x1="1024" y1="0" x2="1024" y2="720"/>
  </g>
  <!-- Play icon -->
  <circle cx="640" cy="320" r="52" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <polygon points="625,300 625,340 665,320" fill="#3b82f6" opacity="0.8"/>
  <!-- Labels -->
  <text x="640" y="420" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#ffffff" opacity="0.9">MYCARTOON.ORG</text>
  <text x="640" y="455" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#3b82f6" opacity="0.7" letter-spacing="3">CHILDREN'S AI PLATFORM · LIVE DEMO</text>
  <!-- Chapters hint -->
  <g transform="translate(240, 560)">
    <rect x="0" y="0" width="110" height="30" rx="15" fill="#3b82f640" stroke="#3b82f660" stroke-width="1"/>
    <text x="55" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#93c5fd" letter-spacing="1">◈ LANDING</text>
  </g>
  <g transform="translate(370, 560)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#8b5cf640" stroke="#8b5cf660" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#c4b5fd" letter-spacing="1">◉ VOICE DIR</text>
  </g>
  <g transform="translate(510, 560)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#10b98140" stroke="#10b98160" stroke-width="1"/>
    <text x="65" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6ee7b7" letter-spacing="1">◆ SCENE GEN</text>
  </g>
  <g transform="translate(660, 560)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#ec489940" stroke="#ec489960" stroke-width="1"/>
    <text x="65" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#f9a8d4" letter-spacing="1">▶ PLAYBACK</text>
  </g>
  <g transform="translate(810, 560)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#f59e0b40" stroke="#f59e0b60" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fcd34d" letter-spacing="1">◎ GAMES</text>
  </g>
  <!-- Corner label -->
  <text x="48" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#ffffff" opacity="0.3" letter-spacing="2">LIVE UI DEMO</text>
