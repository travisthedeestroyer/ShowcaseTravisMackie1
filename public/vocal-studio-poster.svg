<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#100008"/>
      <stop offset="100%" style="stop-color:#1a0010"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="350" cy="280" rx="380" ry="280" fill="#f43f5e" opacity="0.07"/>
  <ellipse cx="950" cy="480" rx="320" ry="220" fill="#a855f7" opacity="0.06"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="144" x2="1280" y2="144"/>
    <line x1="0" y1="288" x2="1280" y2="288"/>
    <line x1="0" y1="432" x2="1280" y2="432"/>
    <line x1="0" y1="576" x2="1280" y2="576"/>
    <line x1="256" y1="0" x2="256" y2="720"/>
    <line x1="512" y1="0" x2="512" y2="720"/>
    <line x1="768" y1="0" x2="768" y2="720"/>
    <line x1="1024" y1="0" x2="1024" y2="720"/>
  </g>
  <!-- Waveform bars -->
  <g transform="translate(540, 230)">
    <rect x="0"   y="40" width="12" height="40" rx="6" fill="#f43f5e" opacity="0.5"/>
    <rect x="20"  y="20" width="12" height="80" rx="6" fill="#f43f5e" opacity="0.6"/>
    <rect x="40"  y="10" width="12" height="100" rx="6" fill="#f43f5e" opacity="0.7"/>
    <rect x="60"  y="30" width="12" height="60" rx="6" fill="#f43f5e" opacity="0.6"/>
    <rect x="80"  y="5"  width="12" height="110" rx="6" fill="#f43f5e" opacity="0.9"/>
    <rect x="100" y="25" width="12" height="70" rx="6" fill="#f43f5e" opacity="0.7"/>
    <rect x="120" y="15" width="12" height="90" rx="6" fill="#f43f5e" opacity="0.8"/>
    <rect x="140" y="35" width="12" height="50" rx="6" fill="#f43f5e" opacity="0.5"/>
    <rect x="160" y="20" width="12" height="80" rx="6" fill="#f43f5e" opacity="0.6"/>
    <rect x="180" y="45" width="12" height="30" rx="6" fill="#f43f5e" opacity="0.4"/>
  </g>
  <!-- Play button -->
  <circle cx="640" cy="300" r="44" fill="#f43f5e" opacity="0.15" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="628,282 628,318 664,300" fill="#f43f5e" opacity="0.9"/>
  <!-- Labels -->
  <text x="640" y="410" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#ffffff" opacity="0.9">AI VOCAL STUDIO</text>
  <text x="640" y="445" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#f43f5e" opacity="0.7" letter-spacing="3">4-AGENT GEMINI PIPELINE · PRODUCT DEMO</text>
  <!-- Chapter pills -->
  <g transform="translate(350, 550)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#f43f5e30" stroke="#f43f5e50" stroke-width="1"/>
    <text x="50" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fda4af" letter-spacing="1">🎤 RECORD</text>
  </g>
  <g transform="translate(470, 550)">
    <rect x="0" y="0" width="110" height="30" rx="15" fill="#a855f730" stroke="#a855f750" stroke-width="1"/>
    <text x="55" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#d8b4fe" letter-spacing="1">⚡ GENERATE</text>
  </g>
  <g transform="translate(600, 550)">
    <rect x="0" y="0" width="90" height="30" rx="15" fill="#06b6d430" stroke="#06b6d450" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#67e8f9" letter-spacing="1">🎛️ MIX</text>
  </g>
  <g transform="translate(710, 550)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#10b98130" stroke="#10b98150" stroke-width="1"/>
    <text x="50" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6ee7b7" letter-spacing="1">✨ MASTER</text>
  </g>
  <text x="48" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#ffffff" opacity="0.3" letter-spacing="2">PRODUCT DEMO</text>
</svg>